name: Baixar bairros (OpenStreetMap)

on:
  workflow_dispatch:
    inputs:
      rodada:
        description: "Número da rodada (uso interno)"
        default: "1"
  schedule:
    - cron: "30 4 1 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: bairros
  cancel-in-progress: false

jobs:
  bairros:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        uf: [PR, SC, RS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar conversor
        run: node scripts/testar-bairros.mjs
      - name: Baixar bairros de ${{ matrix.uf }} em etapas e guardar a cada etapa
        env:
          MAX_MINUTOS: "45"
          UF: ${{ matrix.uf }}
        run: |
          git config user.name "pluvioguard-bot"
          git config user.email "pluvioguard-bot@users.noreply.github.com"
          for etapa in 1 2 3 4 5 6 7; do
            echo "=== ${UF} etapa $etapa ==="
            node scripts/baixar-bairros.mjs data/bairros || true
            git add data/bairros
            if git diff --cached --quiet; then
              echo "Nada novo nesta etapa."
            else
              git commit -m "Atualiza bairros ${UF} (etapa $etapa)"
              for t in 1 2 3 4 5; do
                if git pull --rebase origin main && git push; then break; fi
                sleep $((RANDOM % 10 + 3))
              done
            fi
            FALTAM=$(SO_CONTAR=1 node scripts/baixar-bairros.mjs data/bairros)
            echo "Faltam ${FALTAM} municípios de ${UF}."
            if [ "${FALTAM}" = "0" ]; then break; fi
          done

  publicar:
    needs: bairros
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Republicar o site e continuar se ainda faltarem bairros
        env:
          GH_TOKEN: ${{ github.token }}
          RODADA: ${{ github.event.inputs.rodada || '1' }}
        run: |
          gh workflow run atualizar.yml
          FALTAM=$(SO_CONTAR=1 node scripts/baixar-bairros.mjs data/bairros)
          echo "Faltam ${FALTAM} municípios no total (rodada ${RODADA})."
          if [ "${FALTAM}" != "0" ] && [ "${RODADA}" -lt 4 ]; then
            gh workflow run baixar-bairros.yml -f rodada=$((RODADA + 1))
          fi
