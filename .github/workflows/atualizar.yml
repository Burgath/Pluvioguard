name: Atualizar dados e publicar

on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar chuva real (Open-Meteo)
        run: |
          node scripts/testar.mjs
          mkdir -p _site/data
          node scripts/atualizar-dados.mjs _site/data/weather.json
          cp index.html _site/index.html
          if [ -d data/bairros ]; then cp -r data/bairros _site/data/bairros; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
